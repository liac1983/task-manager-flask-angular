<div class="tasks-container">
  <h2>My Tasks</h2>
  <button (click)="logout()">Logout</button>

  <h3>New Task</h3>
  <form (ngSubmit)="addTask()" #form="ngForm">
    <input
      [(ngModel)]="newTask.title"
      name="title"
      placeholder="Title"
      required
      #titleField="ngModel"
    />
    <p *ngIf="titleField.invalid && titleField.touched" style="color:red">
      Title is required.
    </p>

    <input
      [(ngModel)]="newTask.description"
      name="description"
      placeholder="Description"
    />

    <!-- Category select -->
    <select [(ngModel)]="newTask.category" name="category">
      <option value="work">Work</option>
      <option value="study">Study</option>
      <option value="personal">Personal</option>
      <option value="other">Other</option>
    </select>

    <button type="submit" [disabled]="form.invalid">
      Add
    </button>
  </form>


  <h3>Task List</h3>

  <input
    type="text"
    placeholder="Search tasks..."
    [(ngModel)]="searchText"
    name="searchText"
  />

  <div class="tasks-sort">
    <label for="sort">Sort by:</label>
    <select
      id="sort"
      [(ngModel)]="sortOption"
      (change)="onSortChange()"
      name="sortOption"
    >
      <option value="date">Date (newest first)</option>
      <option value="title">Title (A–Z)</option>
      <option value="status">Status (pending first)</option>
    </select>

    <!-- Filter by category -->
    <label for="filter" style="margin-left: 1rem;">Category:</label>
    <select
      id="filter"
      [(ngModel)]="filterCategory"
      name="filterCategory"
    >
      <option value="all">All</option>
      <option value="work">Work</option>
      <option value="study">Study</option>
      <option value="personal">Personal</option>
      <option value="other">Other</option>
    </select>

  </div>


  <ul>
    <li *ngFor="let task of sortedTasks">
      <!-- Normal view (not editing) -->
      <div *ngIf="editingTask?.id !== task.id">
        <input
          type="checkbox"
          [(ngModel)]="task.done"
          name="done-{{ task.id }}"
          (change)="startEdit(task); saveEdit()"
        />
        <strong [style.text-decoration]="task.done ? 'line-through' : 'none'">
          {{ task.title }}
        </strong>
        - {{ task.description }}

        <!-- Badge de categoria -->
        <span style="font-size: 0.8rem; padding: 0.1rem 0.5rem; border-radius: 999px; background:#e5e7eb;">
          {{ task.category || 'other' }}
        </span>

        <button (click)="startEdit(task)">Edit</button>
        <button (click)="deleteTask(task.id!)">Delete</button>
      </div>

      <!-- Edit view -->
      <div *ngIf="editingTask?.id === task.id">
        <input [(ngModel)]="editingTask!.title" name="editTitle" />
        <input
          [(ngModel)]="editingTask!.description"
          name="editDescription"
        />
        <label>
          Completed
          <input
            type="checkbox"
            [(ngModel)]="editingTask!.done"
            name="editDone"
          />
        </label>

        <!-- Edit category -->
        <select [(ngModel)]="editingTask!.category" name="editCategory">
          <option value="work">Work</option>
          <option value="study">Study</option>
          <option value="personal">Personal</option>
          <option value="other">Other</option>
        </select>

        <button (click)="saveEdit()">Save</button>
        <button (click)="editingTask = null">Cancel</button>
      </div>
    </li>
  </ul>

</div>
