<div class="tasks-container">
  <h2>Minhas tarefas</h2>
  <button (click)="logout()">Logout</button>

  <h3>New Task</h3>
  <form (ngSubmit)="addTask()">
    <input
      [(ngModel)]="newTask.title"
      name="title"
      placeholder="Título"
      required
    />
    <input
      [(ngModel)]="newTask.description"
      name="description"
      placeholder="Descrição"
    />
    <button type="submit">Add</button>
  </form>

  <h3>Task List</h3>
  <ul>
    <li *ngFor="let task of tasks">
      <!-- Normal view (not editing) -->
      <div *ngIf="editingTask?.id !== task.id">
        <input
          type="checkbox"
          [(ngModel)]="task.done"
          name="done-{{ task.id }}"
          (change)="startEdit(task); saveEdit()"
        />
        <strong [style.text-decoration]="task.done ? 'line-through' : 'none'">
          {{ task.title }}
        </strong>
        - {{ task.description }}
        <button (click)="startEdit(task)">Add</button>
        <button (click)="deleteTask(task.id!)">Delete</button>
      </div>

      <!-- Vista de edição -->
      <div *ngIf="editingTask?.id === task.id">
        <input [(ngModel)]="editingTask!.title" name="editTitle" />
        <input
          [(ngModel)]="editingTask!.description"
          name="editDescription"
        />
        <label>
          Completed
          <input
            type="checkbox"
            [(ngModel)]="editingTask!.done"
            name="editDone"
          />
        </label>
        <button (click)="saveEdit()">Save</button>
        <button (click)="editingTask = null">Cancel</button>
      </div>
    </li>
  </ul>
</div>
